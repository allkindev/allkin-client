[package]
name = "allkin-client"
version = "0.1.0"
description = "Client de bureau pour les serveurs Allkin"
edition = "2021"
rust-version = "1.85"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-window-state = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "sync", "time"] }
# Client HTTP minimal, TLS du système (Security.framework, SChannel, OpenSSL) :
# pas de pile TLS embarquée, et les mêmes certificats de confiance que la webview.
ureq = { version = "3.5", default-features = false, features = ["native-tls-no-default"] }
if-addrs = "0.15"
dns-lookup = "4"
open = "5"
sys-locale = "0.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
