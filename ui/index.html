<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Allkin</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <label class="lang">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>
      <select id="lang" data-t-label="language">
        <option value="fr">Français</option>
        <option value="en">English</option>
        <option value="es">Español</option>
        <option value="de">Deutsch</option>
      </select>
    </label>
    <button id="theme" type="button" class="icon-button">
      <svg class="when-light" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
      <svg class="when-dark" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </header>

  <main>
    <div class="brand">
      <span class="logo" aria-hidden="true"></span>
      <h1>Allkin</h1>
    </div>

    <section id="connecting" class="center" hidden>
      <span class="spinner" aria-hidden="true"></span>
      <p id="connecting-text" role="status"></p>
      <button id="connecting-cancel" type="button" class="button quiet" data-t="cancel"></button>
    </section>

    <section id="failure" class="center" hidden>
      <h2 id="failure-title"></h2>
      <p id="failure-detail" class="dim"></p>
      <div class="actions">
        <button id="retry" type="button" class="button primary" data-t="retry"></button>
        <button id="choose" type="button" class="button" data-t="choose"></button>
      </div>
    </section>

    <section id="home" hidden>
      <div id="empty" class="card empty">
        <svg class="empty-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5h.01M7 16.5h.01"/></svg>
        <h2 data-t="emptyTitle"></h2>
        <p class="dim" data-t="emptyText"></p>
        <div class="actions">
          <button type="button" class="button primary" data-action="scan">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <span data-t="scan"></span>
          </button>
          <button type="button" class="button" data-action="manual">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="m13.5 6.5 4 4"/></svg>
            <span data-t="manual"></span>
          </button>
        </div>
      </div>

      <div id="servers">
        <div class="heading">
          <h2 data-t="savedTitle"></h2>
          <div class="actions">
            <button type="button" class="button small" data-action="scan">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
              <span data-t="scan"></span>
            </button>
            <button type="button" class="button small" data-action="manual">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="m13.5 6.5 4 4"/></svg>
              <span data-t="manual"></span>
            </button>
          </div>
        </div>
        <ul id="saved-list" class="list"></ul>
        <p class="hint footer" data-t="backHint"></p>
      </div>
    </section>
  </main>

  <dialog id="scan-dialog" class="modal" aria-labelledby="scan-title">
    <div class="sheet">
      <header>
        <h2 id="scan-title" data-t="scanTitle"></h2>
        <button type="button" class="icon-button" data-close data-t-label="close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </header>
      <div class="body">
        <p class="hint" data-t="scanHint"></p>
        <progress id="scan-bar" max="1"></progress>
        <p id="scan-status" class="hint" role="status"></p>
        <ul id="found-list" class="list"></ul>
      </div>
      <footer>
        <button id="scan-toggle" type="button" class="button"></button>
        <button type="button" class="button primary" data-close data-t="close"></button>
      </footer>
    </div>
  </dialog>

  <dialog id="manual-dialog" class="modal" aria-labelledby="manual-title">
    <form id="manual-form" class="sheet" autocomplete="off">
      <header>
        <h2 id="manual-title" data-t="manualTitle"></h2>
        <button type="button" class="icon-button" data-close data-t-label="close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </header>
      <div class="body">
        <label for="address" data-t="addressLabel"></label>
        <input id="address" type="text" spellcheck="false" autocapitalize="off" autocorrect="off" required>
        <p class="hint" data-t="addressHint"></p>
        <p id="manual-error" class="error" role="alert" hidden></p>
      </div>
      <footer>
        <button type="button" class="button" data-close data-t="cancel"></button>
        <button id="manual-submit" type="submit" class="button primary" data-t="add"></button>
      </footer>
    </form>
  </dialog>
</body>
</html>
